<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>__CSS__</style>
</head>
<body>
<div id="shell">
  <div id="globus" aria-label="Interactive 3D Earth"></div>
  <div id="hud"><div class="title">🌍 RE Nationality Intelligence Globe</div><div class="subtitle">Explore personnel distribution by nationality and workforce attributes</div></div>
  <div id="status" role="status" aria-live="polite" data-state="loading">Loading 3D Earth…</div>
  <aside id="details" aria-label="Nationality details" aria-hidden="true">
    <button class="close" id="closeDetails" type="button" aria-label="Close details">×</button>
    <h3 id="detailNationality">Nationality</h3><div class="muted" id="detailRepresentation"></div>
    <div class="kpi"><div><strong id="detailCount">0</strong><span class="muted">personnel</span></div><div><strong id="detailSections">0</strong><span class="muted">sections</span></div></div>
    <button id="flyTo" type="button">📍 Fly to nationality</button><div id="people"></div>
  </aside>
  <section id="toolbar" aria-label="Workforce filters">
    <div class="row">
      <label><span class="sr-only">Employment category</span><select id="employmentFilter"><option value="">All Employment Categories</option></select></label>
      <label><span class="sr-only">Salary grade</span><select id="sgFilter"><option value="">All Salary Grades</option></select></label>
    </div>
    <div class="row">
      <label><span class="sr-only">Section</span><select id="sectionFilter"><option value="">All Sections</option></select></label>
      <button id="resetFilters" type="button">↺ Reset Filters</button>
    </div>
    <div id="stats" aria-live="polite"></div>
  </section>
  <div id="legend"><span class="legend-dot small"></span> lower <span class="legend-dot medium"></span> medium <span class="legend-dot large"></span> higher concentration</div>
  <div id="attribution">OpenGlobus · <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener noreferrer">© OpenStreetMap contributors</a></div>
</div>
<script id="re-globe-config" type="application/json">__CONFIG_JSON__</script>
__MODULE_SCRIPTS__
<script type="module">__MAIN_SCRIPT__</script>
</body>
</html>
