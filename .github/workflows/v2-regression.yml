name: v2 Regression

on:
  push:
    branches:
      - refactor/v2-modular-architecture
  pull_request:
    branches:
      - main

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest

      - name: Compile Python sources
        run: python -m compileall -q .

      - name: Static 75-function migration audit
        run: python tools/migration_audit.py

      - name: Full pytest suite
        run: pytest -q

      - name: Streamlit v2 boot smoke test
        shell: bash
        run: |
          set -e
          python -m streamlit run v2/app.py --server.headless true --server.port 8501 > /tmp/v2-streamlit.log 2>&1 &
          pid=$!
          trap 'kill $pid || true' EXIT
          for i in {1..20}; do
            if curl --fail --silent http://127.0.0.1:8501/ > /dev/null; then
              echo "v2 Streamlit server booted successfully."
              exit 0
            fi
            sleep 1
          done
          cat /tmp/v2-streamlit.log
          exit 1
