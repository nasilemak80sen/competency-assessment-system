name: Wake Streamlit App

on:
  workflow_dispatch:
  schedule:
    # Community Cloud hibernates apps after 12 hours without traffic.
    # Run every 6 hours so the app receives regular traffic.
    - cron: "0 */6 * * *"

jobs:
  wake-streamlit:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Playwright
        run: |
          python -m pip install --upgrade pip
          python -m pip install playwright
          python -m playwright install --with-deps chromium

      - name: Visit Streamlit application
        env:
          STREAMLIT_APP_URL: https://beta-re-fraternity-dashboard-1.streamlit.app/
        run: |
          python scripts/wake_streamlit.py
